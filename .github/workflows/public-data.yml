name: Public data

# This repository is public: a PR's commits, branch name, title, and body must carry no customer data
# (TECH-5914). The check refuses Terros IDs, emails, phone numbers, and the customer names in the
# PUBLIC_DATA_DENYLIST secret, which is never committed here; it never prints a denylisted name. Keep the
# secret on one line, names separated by commas: Actions masks a secret's whole value in this public log,
# and a multi-line value may not be masked line by line.
#
# Trust boundary: no code a PR can change ever runs with the secret. A pull_request run takes this file
# and the check from the PR, so this workflow tests and runs the PR's own copy of the check with no
# secret: a change to the check is exercised here, and fork PRs get the ID, email and phone checks. The
# names are checked by public-data-trusted.yml, which runs default-branch code only.
# scripts/public-data-workflow.test.mjs asserts both.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  pr-code:
    name: Public data check (PR code, no names)
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Test the check
        run: node --test scripts/check-public-data.test.mjs scripts/public-data-workflow.test.mjs

      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-public-data.mjs range "$BASE" "$HEAD"

      - name: Branch name, PR title and body
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n\n%s\n' "$BRANCH" "$TITLE" "$BODY" | node scripts/check-public-data.mjs text "branch, PR title and body"
