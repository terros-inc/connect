name: Publish Integrations
#
# Manually publishes an integration under integrations/* to the Terros
# platform. Triggered on demand via workflow_dispatch so a merge to main
# doesn't automatically cut a new published version.
#
# Required secrets (npm environment):
#   TERROS_API_KEY - API key used by the Terros CLI to authenticate publish requests

on:
  workflow_dispatch:
    inputs:
      integration:
        description: 'Integration to publish'
        required: true
        type: choice
        options:
          - airtable
          - docusign
          - jobnimbus
          - salesforce
          - zoho

concurrency:
  group: publish-integrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ inputs.integration }}
    runs-on: ubuntu-latest
    environment: terros
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6

      - name: Setup Node.js environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Publish ${{ inputs.integration }}
        run: pnpm run publish
        working-directory: integrations/${{ inputs.integration }}
        env:
          TERROS_API_KEY: ${{ secrets.TERROS_API_KEY }}
