name: Publish integrations
#
# Automatically publishes each integration under integrations/* to the Terros
# platform whenever a PR touching it is merged to main. Only integrations
# with changed files in the merge are published.
#
# Required secrets (npm environment):
#   TERROS_API_KEY - API key used by the Terros CLI to authenticate publish requests

on:
  push:
    branches:
      - main
    paths:
      - 'integrations/**'

concurrency:
  group: publish-integrations-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed integrations
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      integrations: ${{ steps.detect.outputs.integrations }}
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Detect changed integrations
        id: detect
        run: |
          CHANGED=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- integrations \
            | awk -F/ 'NF > 2 { print $2 }' \
            | sort -u \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "integrations=$CHANGED" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.integration }}
    needs: detect
    if: needs.detect.outputs.integrations != '[]'
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        integration: ${{ fromJson(needs.detect.outputs.integrations) }}
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6

      - name: Setup Node.js environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Publish ${{ matrix.integration }}
        run: pnpm run publish
        working-directory: integrations/${{ matrix.integration }}
        env:
          TERROS_API_KEY: ${{ secrets.TERROS_API_KEY }}
