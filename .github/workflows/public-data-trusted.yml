name: Public data (trusted)

# The public-data check with the PUBLIC_DATA_DENYLIST secret (TECH-5914); public-data.yml says what it
# refuses and how to keep the secret. Trust boundary: no code a PR can change ever runs with the secret.
# A pull_request_target run takes this file from the default branch, not from the PR. The job checks out
# the default branch, reads the PR's commits only as git objects (it fetches them into that checkout and
# never checks them out, installs, or runs them), and runs the default branch's copy of the check. It
# runs only for PRs from this repository: a fork PR never gets the secret.
# scripts/public-data-workflow.test.mjs asserts this.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  public-data:
    name: Public data check
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'

      - name: Fetch the PR's commits as data
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --quiet origin "$BASE" "$HEAD"

      - name: Commits
        env:
          PUBLIC_DATA_DENYLIST: ${{ secrets.PUBLIC_DATA_DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/check-public-data.mjs range "$BASE" "$HEAD"

      - name: Branch name, PR title and body
        if: ${{ !cancelled() }}
        env:
          PUBLIC_DATA_DENYLIST: ${{ secrets.PUBLIC_DATA_DENYLIST }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n\n%s\n' "$BRANCH" "$TITLE" "$BODY" | node scripts/check-public-data.mjs text "branch, PR title and body"
