name: Compile

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, synchronize, ready_for_review ]
  schedule:
    - cron: '17 8 * * *'

permissions:
  contents: read

jobs:
  build:
    name: Build packages
    timeout-minutes: 15
    runs-on: "runs-on=${{ github.run_id }}/runner=build-medium-arm64"
    steps:
      - uses: runs-on/action@efac073ea2507ec18797de3a81704201ade11d9d # v2
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6

      - name: Setup Node.js environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint --quiet

      - name: Download OpenAPI
        run: pnpm fetch-openapi
        working-directory: cli

      - name: Test
        run: pnpm -r test

      - name: Check Connect schema drift
        if: github.event_name == 'schedule'
        run: RUN_CONNECT_SCHEMA_DRIFT=1 pnpm --filter @terros-inc/cli exec vitest run src/connect/schemaDrift.test.ts

      - name: Build
        run: pnpm -r build

      - name: Validate integrations
        run: pnpm --workspace-concurrency=1 --filter './integrations/*' exec terros connect validate
