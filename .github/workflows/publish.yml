name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Package'
        required: true
        default: 'sdk'
        type: choice
        options:
          - 'sdk'
          - 'cli'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ inputs.stage }} npm package
    runs-on: ubuntu-latest
    environment: npm
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - uses: pnpm/action-setup@739bfe42ca9233c5e6aca07c1a25a9d34aca49b0 # v6

      - name: Setup Node.js environment
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm -r build

      - name: Publish ${{ inputs.stage }}
        id: publish
        run: pnpm stage publish --provenance
        working-directory: ${{ inputs.stage }}

      - name: Read CLI version
        id: cli-release
        if: success() && steps.publish.outcome == 'success' && inputs.stage == 'cli'
        continue-on-error: true
        run: |
          node <<'NODE'
          const { readFileSync, appendFileSync } = require('node:fs');
          const { version } = JSON.parse(readFileSync('cli/package.json', 'utf8'));
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Sync CLI release to Linear
        if: success() && steps.publish.outcome == 'success' && inputs.stage == 'cli' && steps.cli-release.outcome == 'success'
        continue-on-error: true
        uses: linear/linear-release-action@3b634623620454bac33390451a1dd15ba78e3dc4
        with:
          access_key: ${{ secrets.LINEAR_ACCESS_KEY }}
          name: CLI ${{ steps.cli-release.outputs.version }}
          version: ${{ steps.cli-release.outputs.version }}
          timeout: 300
